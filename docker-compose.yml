# One-command demo (blueprint section 3, Containerization row):
#   docker compose up --build
#   Frontend : http://localhost:8080
#   API docs : http://localhost:8000/docs
#
# Run the ML pipeline first (scripts/run_pipeline.py) so the API serves the real
# ADNI cohort — data/processed and artifacts are mounted read-only into the API
# container, so the cohort file is present here and PATIENT_DATA=adni is honest.
#
# NOTE: the database was previously created as `oasis` (the retired dataset). If
# you have an existing pgdata volume from that era, recreate it once:
#   docker compose down -v && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: neuropilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d neuropilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://app:app@db:5432/neuropilot
      PROJECT_ROOT: /app
      # The container reads the mounted cohort file; the database is seeded from
      # it on first boot and is the store of record thereafter.
      PATIENT_DATA: adni
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata: